<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <title></title>
    </head>
    <body>
        <div id="root"></div>
        <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
        <script type="text/babel">
            function Slide() {
                return (
                    <div>
                        <button>이전</button>
                        <img src="" alt="" />
                        <img src="" alt="" />
                        <img src="" alt="" />
                        <button>다음</button>
                    </div>
                );
            }
            function List() {
                return (
                    <ul>
                        <li>리스트 1</li>
                        <li>리스트 2</li>
                    </ul>
                );
            }
            function Header() {
                return (
                    <header>
                        <h1>HODU</h1>
                        <div>GNB</div>
                    </header>
                );
            }
            function Main() {
                return (
                    <main>
                        <Slide />
                        <List />
                    </main>
                );
            }
            function Footer() {
                return <footer>HODU</footer>;
            }
            const app = (
                <div>
                    <Header />
                    <Main />
                    <Footer />
                </div>
            );

            // DOM에 리액트 컴포넌트 랜더링하기
            const domContainer = document.querySelector("#root");
            const root = ReactDOM.createRoot(domContainer);
            root.render(app, domContainer);
        </script>
    </body>
</html>
