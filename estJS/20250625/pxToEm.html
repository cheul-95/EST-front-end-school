<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Documnet</title>
    </head>
    <style>
        :root{
            --yellow-font-color : rgb(236, 236, 56);
        }
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: rgb(17, 27, 58);
            position: relative;
        }
        body > div{
            width : 60vw;
            height : 80vh ;
            border: 1px solid white;
            border-radius: 30px;
            position: absolute;
            top: 5vh;
            left: 20vw;
            background-color: #ffffff3b;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 30px;
            color: white;
            gap :10%;
        }
        h1{
            color: var(--yellow-font-color);
        }
        body > div > div {
            width: 100%;
        }
        input{
            border-radius: 20px;
            width: calc(100% - 27px);
            height: 40px;
            margin-top : 5px;
            margin-bottom: 20px;
            background: #ffffff3b;
            border: 1px solid white;
            padding-left: 25px;
            color: white;
        }
        button{
            width: 100%;
            height: 40px;
            border-radius: 5px;
            background-color: rgb(37, 125, 240);
            color: aliceblue;
            border: none;
            font-size: 17px;
        }
        .result{
            text-align: center;
            font-size: 20px;
        }
        #result{
            font-size: 30px;
            color: var(--yellow-font-color);
        }
    </style>
    <body>
        <div>
            <h1>em 계산기</h1>
                <div>
                    <div>
                        <p>기본 폰트(px)</p>
                        <input type="text" id="defaultpx" >
                    </div>
                    <div>
                        <p>원하는 폰트 px값</p>
                        <input type="text" id="calcpx" >
                    </div>               
                </div>
                <button type="button" onclick="pxToEm()">em 값 계산</button>
                <div class="result"><span id="input-px"></span><strong id="result"></strong></div>
        </div>
    </body>
    <script>
        function pxToEm(){
            const defaultpx = Number( document.getElementById("defaultpx").value ); 
            const calcpx = Number( document.getElementById("calcpx").value ); 

            document.getElementById("input-px").innerHTML = `${defaultpx}px=`;
            document.getElementById("result").innerHTML = `${calcpx/defaultpx}em`;
        }
    </script>
</html>
