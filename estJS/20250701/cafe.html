<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MY Cafe wnans 계산기</title>
        <style>
            form {
                position: absolute;
                width: 500px;
                height: 500px;
                left: calc(50vw - 300px);
                top: calc(50vh - 350px);
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: space-between;
                padding: 100px 50px;
                border-radius: 20px;
                box-shadow: 0 19px 38px rgba(0, 0, 0, 0.3),
                    0 15px 12px rgba(0, 0, 0, 0.22);
            }
            h1 {
                color: rgb(151, 112, 60);
            }
            div {
                display: flex;
                flex-direction: column;
                width: 100%;
                font-size: 20px;
            }
            select,
            input {
                margin-top: 10px;
                height: 40px;
                font-size: 18px;
                border-color: gainsboro;
                border-radius: 10px;
            }
            button {
                width: 100%;
                height: 40px;
                font-size: 18px;
                background-color: rgb(151, 112, 60);
                border-radius: 10px;
                border: none;
                color: #fff;
            }
            #result {
                text-align: center;
                font-weight: 700;
            }
        </style>
    </head>
    <body>
        <form>
            <h1>My Cafe 주문 계산기</h1>
            <div>
                음류선택
                <select name="menu" id="menu">
                    <option value="">--음류를 선택하세요--</option>
                </select>
            </div>
            <div>
                사이즈
                <select name="size" id="size">
                    <option value="">--사이즈를 선택하세요--</option>
                </select>
            </div>
            <div>
                수량
                <input type="number" id="quantity" />
            </div>
            <button type="submit">계산하기</button>
            <div id="result"></div>
        </form>
    </body>
    <script>
        const drinkList = document.querySelector("#menu");
        const drinkMenu = {
            아메리카노: 2500,
            카페라떼: 3000,
            카페모카: 3500,
            홍차: 2000,
            오렌지쥬스: 2800,
        };
        Object.entries(drinkMenu).forEach(([key, value]) => {
            const option = document.createElement("option");
            option.textContent = `${key} (${value}원)`;
            option.value = value;
            drinkList.appendChild(option);
        });

        const sizeList = document.querySelector("#size");
        const cupSize = {
            Small: 0,
            Medium: 1000,
            Large: 2000,
        };
        Object.entries(cupSize).forEach(([key, value]) => {
            const option = document.createElement("option");
            option.textContent = `${key} (${value}원)`;
            option.value = value;
            sizeList.appendChild(option);
        });

        const fm = document.querySelector("form");
        fm.addEventListener("submit", (e) => {
            e.preventDefault();
            const quantity = document.querySelector("#quantity").value;
            if (drinkList.value == "") {
                alert("음류를 선택해주세요");
                return;
            }
            if (sizeList.value == "") {
                alert("사이즈를 선택해주세요");
                return;
            }
            if (quantity == "" || quantity <= 0) {
                alert("수량을  확인 해주세요");
                return;
            }
            document.querySelector("#result").textContent = `총 금액 : ${
                (Number(drinkList.value) + Number(sizeList.value)) *
                Number(quantity)
            }원 (${Number(quantity)}잔,${Number(sizeList.value)})`;
        });
    </script>
</html>
