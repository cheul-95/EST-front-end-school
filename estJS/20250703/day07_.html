<!DOCTYPE html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>day07</title>
    </head>
    <body>
        <div class="A1 B1">1</div>
        <div class="A2 B2">2</div>
        <figure>
            <img
                style="width: 300px; height: 300px"
                src="https://developer.mozilla.org/ko/docs/Web/API/Element/getBoundingClientRect/element-box-diagram.png"
                alt=""
            />
            <figcaption>getBoundingClientRect 참고 이미지</figcaption>
        </figure>
        <a class="A3 B3" href="#어디로든 문!">3</a>
        <div class="A4 B4" data-role="admin"></div>
    </body>
    <script>
        /**
         *   클래스 제어
         *  classList.add() : 지정한 클래스 값을 추가한다. 만약 추가하려는 클래스가 엘리먼트의 class 속성에 이미 존재한다면 무시한다.
         *  classList.remove() : 지정한 클래스 값을 제거한다.
         *  classList.contains() : 지정한 클래스 값이 엘리먼트의 class 속성에 존재하는지 확인한다.
         *  classList.toggle() : 하나의 인수만 있을 때: 클래스 값을 토글링한다. 즉, 클래스가 존재한다면 제거하고 false를 반환하며, 존재하지 않으면 클래스를 추가하고 true를 반환한다.
         **/
        const element1 = document.querySelector(".A1");
        element1.classList.add("className1");
        console.log(`클래스 리스트: ${element1.classList.value}`);
        element1.classList.remove("B1");
        console.log(`클래스 리스트: ${element1.classList.value}`);
        console.log(
            `클래스 포함여부:${element1.classList.contains("className1")}`
        );
        console.log(
            `클래스 toggle: ${element1.classList.toggle("className1")}`
        );
        console.log(`클래스 리스트: ${element1.classList.value}`);

        /**
         *   요소의 크기/위치
         *  getBoundingClientRect() : 엘리먼트의 크기와 뷰포트에 상대적인 위치 정보를 제공하는 DOMRect 객체를 반환합니다.
         *  offsetLeft() : 읽기 전용 속성은 현재 요소의 왼쪽 상단 모서리가 HTMLElement.offsetParent 노드 내에서 왼쪽으로 얼마나 떨어져 있는지를 픽셀 수로 반환합니다.
         *  offsetTop : HTMLElement 인터페이스의 읽기 전용 속성은 현재 요소의 바깥쪽 테두리(여백 포함)부터 가장 가까운 위치 지정 상위 요소인 offsetParent의 위쪽 패딩 가장자리까지의 거리를 반환합니다.
         **/
        const element2 = document.querySelector(".A2");
        const cliRet = element2.getBoundingClientRect();
        console.log(cliRet);
        const offsetLeft = element2.offsetLeft;
        console.log(offsetLeft);
        const offsetTop = element2.offsetTop;
        console.log(offsetTop);
        /**
         *   속성 제어
         *  getAttribute() : Element 인터페이스의 메서드는 요소의 지정된 속성 값을 반환합니다.
         *  setAttribute() : 지정된 요소의 속성 값을 설정합니다. 속성이 이미 있으면 값은 업데이트됩니다. 속성이 없다면 지정된 이름과 값으로 새 속성이 추가됩니다.
         **/
        const element3 = document.querySelector(".A3");
        console.log(element3.getAttribute("href"));
        element3.setAttribute("data-test", "12345");
        console.log(element3);
        /**
         *   dataset 으로 접근하기 : 인터페이스의 dataset 읽기 전용 속성은 요소의 사용자 데이터 특성 (data-*)에 대한 읽기/쓰기 접근을 제공합니다.
         **/
        const element4 = document.querySelector(".A4");
        console.log(element4.dataset.role);
        element4.dataset.role = "editor";
        console.log(element4.dataset.role);
        element4.dataset.nickName = "Ghost";
    </script>
</html>
